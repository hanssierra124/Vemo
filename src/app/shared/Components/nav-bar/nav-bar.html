<nav class="vemo-header" [class.menu-open]="menuOpen()">
  <div class="vh-left">
    <a routerLink="/" class="vh-logo-wrap">
      <img src="logovemo.svg" alt="VEMO">
      <div class="vh-text-group">
        <span class="brand-name">VEMO</span>
        <span class="vh-city">BARRANQUILLA · 2026</span>
      </div>
    </a>
  </div>

  <!-- Navegación de escritorio -->
  <div class="vh-center">
    <a
      *ngFor="let link of links(); trackBy: trackByPath"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: !!link.exact }"
      class="vh-link"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path *ngFor="let d of link.icon" [attr.d]="d"></path>
      </svg>
      <span>{{ link.label }}</span>
    </a>
  </div>

  <div class="vh-right">
    <a *ngIf="isLoggedIn()" routerLink="/notificaciones" routerLinkActive="active" class="vh-bell" aria-label="Notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="vh-badge" *ngIf="unreadCount() > 0">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    </a>

    <a routerLink="/profile" class="vh-profile-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Mi Perfil</span>
    </a>

    <!-- Disparador del cajón (sólo móvil/tablet, ver CSS) -->
    <button
      type="button"
      class="vh-burger"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="vemo-mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      <span class="vh-burger-bar"></span>
      <span class="vh-burger-bar"></span>
      <span class="vh-burger-bar"></span>
    </button>
  </div>
</nav>

<!-- ══════════════════════════════════════════════════════════════
     CAJÓN MÓVIL — mismas secciones que la barra, en vertical y con
     targets grandes. Se cierra al navegar, con Escape o tocando fuera.
     ══════════════════════════════════════════════════════════════ -->
<div class="vh-scrim" [class.visible]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<aside
  id="vemo-mobile-menu"
  class="vh-drawer"
  [class.open]="menuOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Menú de navegación"
  [attr.inert]="menuOpen() ? null : ''"
>
  <div class="vh-drawer-head">
    <span class="vh-drawer-title">Navegación</span>
    <button type="button" class="vh-drawer-close" (click)="closeMenu()" aria-label="Cerrar menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="vh-drawer-links">
    <a
      *ngFor="let link of links(); trackBy: trackByPath"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: !!link.exact }"
      class="vh-drawer-link"
      (click)="closeMenu()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path *ngFor="let d of link.icon" [attr.d]="d"></path>
      </svg>
      <span>{{ link.label }}</span>
    </a>
  </div>

  <div class="vh-drawer-foot">
    <a *ngIf="isLoggedIn()" routerLink="/notificaciones" class="vh-drawer-link" (click)="closeMenu()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span>Notificaciones</span>
      <span class="vh-drawer-count" *ngIf="unreadCount() > 0">
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    </a>

    <a routerLink="/profile" class="vh-drawer-cta" (click)="closeMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>{{ isLoggedIn() ? 'Mi Perfil' : 'Entrar / Crear cuenta' }}</span>
    </a>
  </div>
</aside>
